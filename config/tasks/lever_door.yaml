# Rotating Lever Door: レバーを回してラッチを解除し、その後ドアを開く。
task_id: lever_door
name: Rotating Lever Door
description: 回転レバーを下げてラッチを引っ込め、ドアを押して/引いて開く
instruction: "turn the lever down and open the door"
fps: 25               # 物理 dt=4ms×10。1/fps と dt が整数 ns になる値だけ使う (30 だと cam 更新位相がずれる)
max_steps: 1000
camera: {name: front, width: 640, height: 480, hfov: 1.2, pose: [0.22, -0.42, 0.28, 0.0, 0.55, 1.5708]}
scene:
  door: {width: 0.16, height: 0.14, thickness: 0.012, hinge_xy: [0.22, -0.10], damping: 0.02, friction: 0.005}
  lever: {length: 0.05, radius: 0.010, axis_height: 0.045, edge_offset: 0.035, standoff: 0.050, spring: 0.0, friction: 0.02}   # 回転式ラッチ: 先端が U 字の受け金に掛かる。ばね無し (摩擦で下げた位置に留まる)
randomize:
  door_hinge_xy: {x: [0.21, 0.225], y: [-0.12, -0.08]}
implemented: true
home: [0.9, -1.0, 1.0, 0.6, 0.0, 0.0]   # 腕を y<0 側 (ヒンジ側) へ逃がす: レバーの受け金 (自由端側 y>0) をまたがずに接近できる。home のまま板に食い込むと物理が破綻する (実測)
success:
  type: lever_door
  lever_threshold: 0.5     # [rad] この角度以上でラッチ解除とみなす
  target_angle: 0.5        # ドア開放角 [rad]
  require_order: true      # レバー操作 → ドア開放の順序を要求
  settle_steps: 10
