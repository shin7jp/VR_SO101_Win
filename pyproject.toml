[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "vrso101"
version = "0.1.0"
description = "SO-101 VR teleop -> LeRobot dataset -> ACT -> Gazebo inference"
requires-python = ">=3.12"
# torch は CUDA 版を別途入れるためここでは宣言しない (SETUP.md 参照)
dependencies = [
  "numpy>=2.0,<2.3",
  "pyyaml>=6",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "opencv-python-headless>=4.9",
  "psutil>=5.9",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vrso101 = "vrso101.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gazebo: 実 Gazebo/ROS 2 (WSL) が必要。無ければ skip",
  "gpu: CUDA が必要",
]
